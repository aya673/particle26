<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ネコパズル - モード選択版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #e0f0ff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        canvas { box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-radius: 8px; }
        #menu, #result { position: absolute; background: rgba(255,255,255,0.95); padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        button { font-size: 18px; padding: 10px 20px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
        #hud { position: absolute; top: 10px; display: flex; gap: 20px; font-size: 20px; font-weight: bold; background: rgba(255,255,255,0.8); padding: 5px 15px; border-radius: 20px; pointer-events: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        <div id="scoreDisplay">スコア: 0</div>
        <div id="timerDisplay">時間: 0.00秒</div>
    </div>

    <div id="menu">
        <h2>ネコパズル モード選択</h2>
        <button onclick="startGame('endless')">エンドレスモード</button>
        <button onclick="startGame('ta')">タイムアタック (3000点先取)</button>
    </div>

    <div id="result" class="hidden">
        <h2 id="resultTitle">クリア！</h2>
        <p id="resultText"></p>
        <button onclick="backToMenu()">メニューに戻る</button>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;

        const width = 400;
        const height = 600;
        const catTypes = [
            { radius: 20, color: "#FFFFFF", score: 10, next: 1 },
            { radius: 30, color: "#FFEBCD", score: 20, next: 2 },
            { radius: 45, color: "#FFA500", score: 40, next: 3 },
            { radius: 60, color: "#A9A9A9", score: 80, next: 4 },
            { radius: 80, color: "#D2691E", score: 160, next: 5 },
            { radius: 100, color: "#333333", score: 320, next: null } // 黒猫
        ];

        let engine, render, runner;
        let currentCat = null;
        let canDrop = true;
        let score = 0;
        let gameMode = 'endless';
        let startTime = 0;
        let timerInterval = null;
        let isGameActive = false;
        const TARGET_SCORE = 3000;

        function initPhysics() {
            engine = Engine.create();
            render = Render.create({
                element: document.body,
                engine: engine,
                options: { width, height, wireframes: false, background: '#f9f9f9' }
            });

            const ground = Bodies.rectangle(width / 2, height + 25, width, 50, { isStatic: true, render: { fillStyle: '#8b4513' } });
            const leftWall = Bodies.rectangle(-25, height / 2, 50, height, { isStatic: true });
            const rightWall = Bodies.rectangle(width + 25, height / 2, 50, height, { isStatic: true });
            Composite.add(engine.world, [ground, leftWall, rightWall]);

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            // カスタム描画
            Events.on(render, 'afterRender', drawCats);
            // 衝突処理
            Events.on(engine, "collisionStart", handleCollision);
        }

        function startGame(mode) {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            gameMode = mode;
            score = 0;
            isGameActive = true;
            canDrop = true;
            document.getElementById('scoreDisplay').innerText = `スコア: ${score}`;

            initPhysics();
            spawnNext();

            if (gameMode === 'ta') {
                startTime = performance.now();
                document.getElementById('timerDisplay').classList.remove('hidden');
                timerInterval = setInterval(() => {
                    const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                    document.getElementById('timerDisplay').innerText = `時間: ${elapsed}秒`;
                }, 50);
            } else {
                document.getElementById('timerDisplay').classList.add('hidden');
            }

            // 操作イベント登録
            window.addEventListener("mousemove", onMouseMove);
            window.addEventListener("mousedown", onMouseDown);
        }

        function spawnNext() {
            if (!isGameActive) return;
            const index = Math.floor(Math.random() * 3);
            const type = catTypes[index];
            currentCat = Bodies.circle(width / 2, 50, type.radius, {
                isStatic: true,
                plugin: { typeIndex: index },
                render: { visible: false }
            });
            Composite.add(engine.world, currentCat);
        }

        function onMouseMove(e) {
            if (currentCat && currentCat.isStatic) {
                const rect = render.canvas.getBoundingClientRect();
                const x = Math.max(currentCat.circleRadius, Math.min(width - currentCat.circleRadius, e.clientX - rect.left));
                Body.setPosition(currentCat, { x, y: 50 });
            }
        }

        function onMouseDown() {
            if (!canDrop || !currentCat || !isGameActive) return;
            canDrop = false;
            Body.setStatic(currentCat, false);
            currentCat = null;
            setTimeout(() => { spawnNext(); canDrop = true; }, 800);
        }

        function handleCollision(event) {
            event.pairs.forEach((pair) => {
                const { bodyA, bodyB } = pair;
                const idxA = bodyA.plugin.typeIndex;
                const idxB = bodyB.plugin.typeIndex;

                if (idxA !== undefined && idxA === idxB) {
                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;
                    
                    Composite.remove(engine.world, [bodyA, bodyB]);
                    score += catTypes[idxA].score;
                    document.getElementById('scoreDisplay').innerText = `スコア: ${score}`;

                    if (catTypes[idxA].next !== null) {
                        // 次のネコへ進化
                        const newIdx = catTypes[idxA].next;
                        const newCat = Bodies.circle(midX, midY, catTypes[newIdx].radius, {
                            plugin: { typeIndex: newIdx },
                            render: { visible: false }
                        });
                        Composite.add(engine.world, newCat);
                    } else {
                        // 【改善】黒猫同士が合体したら消滅して高得点
                        score += 500;
                        document.getElementById('scoreDisplay').innerText = `スコア: ${score}`;
                    }

                    // タイムアタックのクリア判定
                    if (gameMode === 'ta' && score >= TARGET_SCORE) {
                        endGame(true);
                    }
                }
            });
        }

        function drawCats() {
            const context = render.context;
            const bodies = Composite.allBodies(engine.world);

            bodies.forEach(body => {
                if (body.plugin.typeIndex !== undefined) {
                    const { x, y } = body.position;
                    const r = body.circleRadius;
                    const angle = body.angle;
                    const color = catTypes[body.plugin.typeIndex].color;

                    context.save();
                    context.translate(x, y);
                    context.rotate(angle);

                    // 耳
                    context.fillStyle = color;
                    context.strokeStyle = "#000";
                    context.lineWidth = 2;
                    [-0.8, 0.2].forEach(sign => {
                        context.beginPath();
                        context.moveTo(r * sign, -r * 0.2);
                        context.lineTo(r * (sign + (sign < 0 ? -0.1 : 0.7)), -r * 1.1);
                        context.lineTo(r * (sign + (sign < 0 ? 0.6 : -0.2)), -r * 0.8);
                        context.fill(); context.stroke();
                    });

                    // 顔
                    context.beginPath();
                    context.arc(0, 0, r, 0, Math.PI * 2);
                    context.fill(); context.stroke();

                    // 目・鼻
                    context.fillStyle = body.plugin.typeIndex === 5 ? "#FFF" : "#000";
                    context.beginPath();
                    context.arc(-r * 0.3, -r * 0.1, r * 0.1, 0, Math.PI * 2);
                    context.arc(r * 0.3, -r * 0.1, r * 0.1, 0, Math.PI * 2);
                    context.fill();
                    context.fillStyle = "#FFC0CB";
                    context.beginPath();
                    context.arc(0, r * 0.1, r * 0.08, 0, Math.PI * 2);
                    context.fill();

                    context.restore();
                }
            });
        }

        function endGame(isClear) {
            isGameActive = false;
            clearInterval(timerInterval);
            
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mousedown", onMouseDown);

            const resultDiv = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultText = document.getElementById('resultText');

            if (gameMode === 'ta' && isClear) {
                const finalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                resultTitle.innerText = "タイムアタッククリア！";
                resultText.innerText = `${TARGET_SCORE}点達成タイム: ${finalTime}秒`;
            } else {
                resultTitle.innerText = "ゲーム終了";
                resultText.innerText = `最終スコア: ${score}点`;
            }

            resultDiv.classList.remove('hidden');
        }

        function backToMenu() {
            document.getElementById('result').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            
            // 物理エンジンのクリーンアップ
            if (render) {
                Render.stop(render);
                render.canvas.remove();
            }
            if (runner) Runner.stop(runner);
        }
    </script>
</body>
</html>
